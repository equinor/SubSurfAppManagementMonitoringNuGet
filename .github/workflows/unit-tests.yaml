name: Run Unit Tests
run-name: ${{ github.actor }} is running backend unit tests
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "Equinor.SubSurfAppManagementMonitoringNuGet/**"
      - "Equinor.SubSurfAppManagementMonitoringNuGet.UnitTests/**"
      - ".github/workflows/unit-tests.yaml"

permissions: {}

jobs:
  unit-tests:
    name: run unit tests for API
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: run unit tests
        run: dotnet test
        working-directory: Equinor.SubSurfAppManagementMonitoringNuGet.UnitTests
