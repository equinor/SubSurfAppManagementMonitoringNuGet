name: Scanning for Secrets
run-name: ${{ github.actor }} is scanning for secrets

# Controls when the action will run
on:
  push:
    branches:
      - main
  pull_request:

# Control the permissions for the workflow
# We default to no permissions so jobs have to explicitly set permissions they need. This is a secure default.
permissions: {}

# Jobs
jobs:
  TruffleHog:
    name: Secret Scanning
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          
      - name: 🕵🏽‍♂️ TruffleHog OSS
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b
        with:
          extra_args: --results=verified,unknown